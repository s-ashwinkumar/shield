# --- rdev begin ---
# Quick jump to any window in rdev session
bind-key s choose-tree -swZ -f '#{==:#{session_name},rdev}'
# Disable activity monitoring (prevents black highlighting of tabs)
setw -g monitor-activity off
set -g visual-activity off
# Auto-start rwatch to monitor Claude panes for stuck prompts
set-hook -g session-created 'run-shell "pgrep -f rwatch >/dev/null 2>&1 || nohup ~/.local/bin/rwatch 30 >/dev/null 2>&1 &"'
# --- rdev end ---
